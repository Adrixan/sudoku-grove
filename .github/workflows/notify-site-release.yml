name: Notify Lernspiele site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Request a full site release
        env:
          GH_TOKEN: ${{ secrets.LERNSPIELE_DISPATCH_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "LERNSPIELE_DISPATCH_TOKEN is not configured; skipping automatic site release." >&2
            exit 0
          fi
          gh api repos/Adrixan/lernspiele.aufner.org/dispatches \
            --method POST \
            --field event_type=game-release \
            --field client_payload[source]=sudoku-grove \
            --field client_payload[commit]="$HEAD_SHA"
